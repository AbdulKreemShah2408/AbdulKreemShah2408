name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually from Actions tab
  workflow_dispatch:
- uses: lowlighter/metrics@latest
  with:
    # Your GitHub token
    # The token is generated by GitHub automatically, you don't need to create a custom token
    token: ${{ secrets.METRICS_TOKEN }}

    # Options
    template: classic
    base: header, activity, community, repositories, metadata
    plugin_habits: yes
    plugin_habits_from: 200
    plugin_habits_days: 14
    plugin_habits_factories: "app.git"
    plugin_habits_seed: 8721
    plugin_lines: yes
    plugin_isocalendar: yes
    plugin_isocalendar_duration: full-year
    plugin_traffic: yes
    plugin_radar: yes
    plugin_stars: yes
    plugin_stars_limit: 4
